</head>
<body>

        </div>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
       <button id="reset-btn">Reset Game</button>
        
        <script src="script.js" defer></script>
    
    </main>  
</body>
</html>
